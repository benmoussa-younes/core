name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Install reuse
        run: pipx install reuse==5.0.2

      - name: Licence
        run: ~/.local/bin/reuse lint

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Verify tag matches VersionPrefix
        run: |
          version="$(dotnet msbuild src/Core/Core.csproj -getProperty:VersionPrefix -nologo)"
          test "$version" = "${GITHUB_REF_NAME#v}"

      - name: Create source archive
        run: |
          mkdir -p artifacts
          prefix="core-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "artifacts/${prefix}-src.tar.gz" HEAD
          (cd artifacts && sha256sum "${prefix}-src.tar.gz" > "${prefix}-src.tar.gz.sha256")

      - name: Verify source archive and create SBOM
        run: |
          mkdir -p /tmp/core-src
          tar -xzf "artifacts/core-${GITHUB_REF_NAME}-src.tar.gz" -C /tmp/core-src
          cd "/tmp/core-src/core-${GITHUB_REF_NAME}"
          ~/.local/bin/reuse lint
          ~/.local/bin/reuse spdx > "${GITHUB_WORKSPACE}/artifacts/core.spdx"
          dotnet build -c Release
          dotnet test -c Release --no-build

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Core ${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/*
          fi
