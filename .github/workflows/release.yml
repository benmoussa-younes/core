name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Licence
        run: pipx run reuse==5.0.2 lint

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Verify tag matches VersionPrefix
        run: |
          version="$(dotnet msbuild src/Core/Core.csproj -getProperty:VersionPrefix -nologo)"
          test "$version" = "${TAG#v}"

      - name: Create source archive
        run: |
          mkdir -p artifacts
          prefix="core-${TAG}"
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "artifacts/${prefix}-src.tar.gz" HEAD
          (cd artifacts && sha256sum "${prefix}-src.tar.gz" > "${prefix}-src.tar.gz.sha256")

      - name: Verify source archive and create SBOM
        run: |
          mkdir -p /tmp/core-src
          tar -xzf "artifacts/core-${TAG}-src.tar.gz" -C /tmp/core-src
          cd "/tmp/core-src/core-${TAG}"
          pipx run reuse==5.0.2 lint
          pipx run reuse==5.0.2 spdx > "${GITHUB_WORKSPACE}/artifacts/core.spdx"
          dotnet build -c Release
          dotnet test -c Release --no-build

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Core ${TAG}" \
              --generate-notes \
              artifacts/*
          fi
