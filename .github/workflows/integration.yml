name: GUI integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      # The real X11 backend needs the client libraries even under Xvfb.
      - name: X11 libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          xvfb libx11-6 libice6 libsm6 libfontconfig1 libxext6 libxrandr2 libxi6 libxcursor1

      - name: Build
        run: dotnet build tests/Core.UI.IntegrationTests/Core.UI.IntegrationTests.csproj -c Release

      - name: Test on Xvfb
        env:
          CORE_GUI_TESTS: "1"
        run: >
          xvfb-run -a dotnet test tests/Core.UI.IntegrationTests/Core.UI.IntegrationTests.csproj
          -c Release --no-build --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-results
          if-no-files-found: ignore
          path: TestResults/*.trx
