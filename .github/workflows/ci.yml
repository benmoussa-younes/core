name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The comment linter judges the commits since the base, so the merge
          # commit's first parent must be present.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      # The gate is a Scripts binary: the interpreter comes from the pinned
      # release, verified by its SHA-256, and `reuse` from pipx. The gate runs
      # the build, the tests and `reuse lint` itself.
      - name: Install the toolchain
        env:
          SCRIPTS_VERSION: 0.1.2
          SCRIPTS_SHA256: db1b23ffa5c3baea6294f9b1f2f36a0d3b8dd9dd8646ffe95dc3dc9c9bb9214f
        run: |
          pipx install --force reuse==5.0.2
          curl -fsSL -o "$RUNNER_TEMP/scripts.tar.gz" \
            "https://github.com/benmoussa-younes/scripts/releases/download/v${SCRIPTS_VERSION}/scripts_${SCRIPTS_VERSION}_linux-x64.tar.gz"
          echo "${SCRIPTS_SHA256}  $RUNNER_TEMP/scripts.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/scripts.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/scripts-${SCRIPTS_VERSION}/scripts" "$HOME/.local/bin/scripts"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/scripts" --version

      - name: Gate
        run: tools/scripts/binaries/gate.scs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          if-no-files-found: ignore
          path: TestResults/*.trx

  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Publish the Unix probe and run its self-test
        run: |
          if ! dotnet publish tests/Core.Unix.Probe/Core.Unix.Probe.csproj -c Release -r linux-x64 -o "$RUNNER_TEMP/unix-probe" > publish.log 2>&1; then
            cat publish.log
            exit 1
          fi
          if grep -qE 'ILC: |ILC : |warning IL' publish.log; then
            cat publish.log
            exit 1
          fi
          "$RUNNER_TEMP/unix-probe/Core.Unix.Probe" --self-test

  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install reuse
        run: pipx install --force reuse==5.0.2
      - name: Check the licence layout
        run: reuse lint
